---
# Aplicar ANTES del deployment: kubectl apply -f training-platform-mcp-g2-db-secret.yaml
# Para grupos: cambiar el nombre a skill-adelina-grupo-N-db-secret
#              y actualizar el secretKeyRef en k8s-deployment.yaml
apiVersion: v1
kind: Secret
metadata:
  name: training-platform-mcp-g2-db-secret
type: Opaque
stringData:
  db_host: "CAMBIAR_POR_HOST_SQL_SERVER"
  db_port: "1433"
  db_user: "sa"
  db_password: "CAMBIAR_POR_PASSWORD"
  db_name: "HistorialCursos"
