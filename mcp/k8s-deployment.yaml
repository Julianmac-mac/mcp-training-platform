---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-adelina
spec:
  minReadySeconds: 20
  replicas: 1
  selector:
    matchLabels:
      app: skill-adelina
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: skill-adelina
    spec:
      containers:
        - image: 435512111670.dkr.ecr.us-east-1.amazonaws.com/eco/back:skill-adelina-1
          name: skill-adelina
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/1/historial-cursos/ping
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: GO_BASE_PATH
              value: "https://servicios-dev.finneg.com"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: skill-adelina-db-secret
                  key: db_host
                  optional: true
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: skill-adelina-db-secret
                  key: db_port
                  optional: true
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: skill-adelina-db-secret
                  key: db_user
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skill-adelina-db-secret
                  key: db_password
                  optional: true
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skill-adelina-db-secret
                  key: db_name
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: skill-adelina-service
spec:
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: skill-adelina
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
  name: skill-adelina-ingress
spec:
  ingressClassName: nginx-servicios
  rules:
    - http:
        paths:
          - backend:
              service:
                name: skill-adelina-service
                port:
                  number: 80
            path: /api/1/historial-cursos/
            pathType: Prefix
